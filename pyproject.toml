[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoclip"
version = "0.1.0"
description = "AI-powered video mix clipping agent — star hub architecture with multi-agent collaboration"
readme = "README.md"
authors = [
    {name = "HiPeng", email = "helpenx@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["video", "clip", "ai", "fastapi", "ffmpeg", "agent", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 核心依赖（仅包含 v0.1 实际使用的包）
dependencies = [
    # Web 框架
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",

    # AI / LLM
    "openai>=1.0.0",
    "langgraph>=1.0",
    "langgraph-checkpoint>=2.0",
    "httpx>=0.24.0",

    # 视频处理
    "opencv-python>=4.8.0",
    "pydub>=0.25.0",

    # 语音识别
    "speechrecognition>=3.14.0",

    # 数据分析与科学计算
    "numpy>=1.23.0,<2.3.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",

    # 日志处理
    "python-json-logger>=2.0.0",
    "colorama>=0.4.6",

    # 环境变量管理
    "python-dotenv>=1.0.0",

    # YAML 配置文件处理
    "pyyaml>=6.0",

    # HTTP 客户端
    "requests>=2.25.0,<3.0.0",
    "aiohttp>=3.8.0",
    "urllib3>=1.25.4,<2.1",

    # 任务队列
    "redis>=4.0.0",

    # 进度显示
    "tqdm>=4.60.0",
]

# 可选依赖分组
[project.optional-dependencies]
# 开发工具
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# GPU 支持（可选，替代 torch 的 CPU 版本）
gpu = [
    "torch>=2.0.0 --index-url https://download.pytorch.org/whl/cu118",
]

# 文档生成
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=1.0.0",
]

# 性能分析
profiling = [
    "memory-profiler>=0.61.0",
    "line-profiler>=4.0.0",
]

# 所有依赖（开发+文档+性能）
all = [
    "neoclip[dev,docs,profiling]",
]

# 项目 URLs
[project.urls]
Homepage = "https://github.com/neopen/video-clip-agent"
Repository = "https://github.com/neopen/video-clip-agent.git"
Documentation = "https://clip.pengline.cn"
Issues = "https://github.com/neopen/video-clip-agent/issues"
Changelog = "https://github.com/neopen/video-clip-agent/blob/main/CHANGELOG.md"

# 命令行入口点（v0.1 使用 main.py 直接启动）
[project.scripts]
neoclip = "neoclip.app.setup_env:main"

# 包查找配置
[tool.setuptools.packages.find]
where = ["src"]
include = ["neoclip*", "neoclip.*"]
exclude = ["tests*", "examples*", "docs*"]

# 包数据文件
[tool.setuptools.package-data]
neoclip = [
    "config/*.json",
]

# Black 代码格式化配置
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.env
  | build
  | dist
  | __pycache__
)/
'''

# Ruff 代码检查配置
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["neoclip"]

# pytest 配置
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov=neoclip",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

# mypy 类型检查配置
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# coverage.py 配置
[tool.coverage.run]
source = ["src/neoclip"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]

# 项目元数据（用于 setuptools）
[tool.setuptools]
zip-safe = false
include-package-data = true


# 预提交钩子配置（可选，但推荐）
[tool.pre-commit]
repos = [
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.4.0", hooks = [
        "end-of-file-fixer",
        "trailing-whitespace",
        "check-yaml",
        "check-json",
    ]},
    {repo = "https://github.com/psf/black", rev = "23.3.0", hooks = ["black"]},
    {repo = "https://github.com/charliermarsh/ruff-pre-commit", rev = "v0.0.275", hooks = ["ruff"]},
]